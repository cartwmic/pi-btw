name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 14 * * 1'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    name: Pi ${{ matrix.pi }}
    strategy:
      fail-fast: false
      matrix:
        pi: [locked]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.1
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run typecheck
